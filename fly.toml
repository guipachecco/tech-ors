# Fly.io (pago, mas barato: ~US$ 2–5/mês). Uso: veja docs/deploy.md
# Troque "orcamentos-techmaster" por um nome único seu antes do primeiro `fly launch`/`fly deploy`.
app = "orcamentos-techmaster"
primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/orcamentos.db"

[mounts]
  source = "orcamentos_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # banco em arquivo: uma máquina sempre ligada
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
