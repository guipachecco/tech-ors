# Fly.io (pago, mas barato: ~US$ 3–5/mês). Uso: veja docs/deploy.md
# Troque "orcamentos-techmaster" por um nome único seu antes do primeiro `fly launch`/`fly deploy`.
app = "orcamentos-techmaster"
primary_region = "gru"   # São Paulo
swap_size_mb = 512       # memória extra em disco, para a máquina barata de 512 MB

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/orcamentos.db"

[mounts]
  source = "orcamentos_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # banco em arquivo: uma máquina sempre ligada
  auto_start_machines = true
  min_machines_running = 1

# Máquina mais barata que aguenta o sistema. Se aparecer erro de memória (ao enviar fotos grandes), troque para "1gb".
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
